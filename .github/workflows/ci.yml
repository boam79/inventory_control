name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          global-json-file: global.json
      - run: dotnet restore --nologo
      - run: dotnet build --nologo --no-restore
      - run: dotnet test Inventory.Tests/Inventory.Tests.csproj --nologo --no-build
